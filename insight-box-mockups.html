<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Insight Box Mockups</title>
<style>
  body {
    margin: 0;
    padding: 32px;
    background: #1c1916;
    color: #f1f5f9;
    font-family: Inter, system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 24px; font-weight: 500; color: #c8f000; }
  h2 { font-size: 13px; margin: 32px 0 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; }
  .mock { background: #252018; border: 1px solid #3a352c; border-top: 2px solid #c8f000; padding: 0; }
  .mock-label { font-size: 11px; color: #c8f000; padding: 8px 16px; border-bottom: 1px solid #3a352c; font-family: 'JetBrains Mono', monospace; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Insight Box — 4 directions (selected year: 2001)</h1>

<div class="grid">

  <!-- A. CRISIS DELTA -->
  <div>
    <h2>A · Crisis-delta card</h2>
    <div class="mock">
      <div class="mock-label">A · CRISIS DELTA</div>
      <svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
        <style>
          .title { font: 600 16px Inter, sans-serif; fill: #f1f5f9; }
          .sub   { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
          .label { font: 400 12px Inter, sans-serif; fill: #cbd5e1; }
          .val   { font: 500 13px 'JetBrains Mono', monospace; fill: #f1f5f9; }
          .down  { font: 500 11px 'JetBrains Mono', monospace; fill: #e5321c; }
          .flat  { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
          .note  { font: 400 11px Inter, sans-serif; fill: #94a3b8; }
          .crisis{ font: 500 11px Inter, sans-serif; fill: #e5321c; }
        </style>
        <text x="20" y="32" class="title">2001</text>
        <text x="20" y="52" class="sub">VS. 1998–2000 BASELINE</text>

        <line x1="20" x2="460" y1="68" y2="68" stroke="#3a352c" stroke-width="1"/>

        <text x="20"  y="92"  class="label">Energy</text>
        <text x="200" y="92"  class="val">69.5%</text>
        <text x="280" y="92"  class="down">▼ 4.2 pts</text>

        <text x="20"  y="116" class="label">Valence</text>
        <text x="200" y="116" class="val">58.6%</text>
        <text x="280" y="116" class="down">▼ 6.1 pts</text>

        <text x="20"  y="140" class="label">Tempo</text>
        <text x="200" y="140" class="val">117 BPM</text>
        <text x="280" y="140" class="flat">▬ 0.4 pts</text>

        <text x="20"  y="164" class="label">Danceability</text>
        <text x="200" y="164" class="val">62.1%</text>
        <text x="280" y="164" class="down">▼ 1.8 pts</text>

        <line x1="20" x2="460" y1="180" y2="180" stroke="#3a352c" stroke-width="1"/>
        <circle cx="28" cy="200" r="4" fill="#f0a830"/>
        <text x="40" y="204" class="crisis" style="fill:#f0a830">Dot-com bust</text>
        <circle cx="160" cy="200" r="4" fill="#e5321c"/>
        <text x="172" y="204" class="crisis">9/11 &amp; War on Terror</text>
      </svg>
    </div>
  </div>

  <!-- B. YEAR IN CONTEXT -->
  <div>
    <h2>B · Year-in-context card</h2>
    <div class="mock">
      <div class="mock-label">B · YEAR IN CONTEXT</div>
      <svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
        <style>
          .title { font: 600 16px Inter, sans-serif; fill: #f1f5f9; }
          .sub   { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
          .label { font: 400 12px Inter, sans-serif; fill: #cbd5e1; }
          .val   { font: 500 13px 'JetBrains Mono', monospace; fill: #f1f5f9; }
          .down  { font: 500 11px 'JetBrains Mono', monospace; fill: #e5321c; }
          .up    { font: 500 11px 'JetBrains Mono', monospace; fill: #82d4be; }
          .rank  { font: 500 12px 'JetBrains Mono', monospace; fill: #c8f000; }
          .note  { font: 400 11px Inter, sans-serif; fill: #94a3b8; }
        </style>
        <text x="20" y="32" class="title">2001</text>
        <text x="20" y="52" class="sub">YoY · RANK IN 1986–2024</text>

        <line x1="20" x2="460" y1="68" y2="68" stroke="#3a352c" stroke-width="1"/>

        <text x="20"  y="92"  class="label">Energy</text>
        <text x="170" y="92"  class="val">69.5%</text>
        <text x="250" y="92"  class="down">▼ 1.4</text>
        <text x="330" y="92"  class="rank">#12 / 39</text>

        <text x="20"  y="116" class="label">Valence</text>
        <text x="170" y="116" class="val">58.6%</text>
        <text x="250" y="116" class="down">▼ 2.7</text>
        <text x="330" y="116" class="rank">#34 / 39</text>

        <text x="20"  y="140" class="label">Tempo</text>
        <text x="170" y="140" class="val">117 BPM</text>
        <text x="250" y="140" class="up">▲ 0.8</text>
        <text x="330" y="140" class="rank">#9 / 39</text>

        <text x="20"  y="164" class="label">Danceability</text>
        <text x="170" y="164" class="val">62.1%</text>
        <text x="250" y="164" class="down">▼ 0.9</text>
        <text x="330" y="164" class="rank">#21 / 39</text>

        <line x1="20" x2="460" y1="180" y2="180" stroke="#3a352c" stroke-width="1"/>
        <text x="20" y="202" class="note">3rd-lowest valence year in the visible range.</text>
      </svg>
    </div>
  </div>

  <!-- C. REGIONAL SPLIT -->
  <div>
    <h2>C · Regional split card</h2>
    <div class="mock">
      <div class="mock-label">C · REGIONAL SPLIT</div>
      <svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
        <style>
          .title { font: 600 16px Inter, sans-serif; fill: #f1f5f9; }
          .sub   { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
          .reg   { font: 400 12px Inter, sans-serif; fill: #cbd5e1; }
          .v     { font: 500 12px 'JetBrains Mono', monospace; fill: #f1f5f9; }
          .head  { font: 500 10px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
        </style>
        <text x="20" y="32" class="title">2001 · Valence by region</text>
        <text x="20" y="52" class="sub">SELECTED: EUROPE · AMERICAS · ASIA</text>

        <line x1="20" x2="460" y1="68" y2="68" stroke="#3a352c" stroke-width="1"/>

        <!-- Bars -->
        <text x="20" y="92" class="reg">Europe</text>
        <rect x="120" y="82" width="220" height="12" fill="#3a352c"/>
        <rect x="120" y="82" width="160" height="12" fill="#c8f000"/>
        <text x="350" y="92" class="v">61.2%</text>

        <text x="20" y="120" class="reg">Americas</text>
        <rect x="120" y="110" width="220" height="12" fill="#3a352c"/>
        <rect x="120" y="110" width="135" height="12" fill="#e5321c"/>
        <text x="350" y="120" class="v">56.8%</text>

        <text x="20" y="148" class="reg">Asia</text>
        <rect x="120" y="138" width="220" height="12" fill="#3a352c"/>
        <rect x="120" y="138" width="148" height="12" fill="#6aabf0"/>
        <text x="350" y="148" class="v">58.4%</text>

        <line x1="20" x2="460" y1="170" y2="170" stroke="#3a352c" stroke-width="1"/>
        <text x="20" y="192" class="head">SPREAD</text>
        <text x="90" y="192" class="v">4.4 pts</text>
        <text x="200" y="192" class="head">HIGHEST</text>
        <text x="280" y="192" class="v">Europe</text>
      </svg>
    </div>
  </div>

  <!-- D. AUTO NARRATIVE -->
  <div>
    <h2>D · Auto-narrative card</h2>
    <div class="mock">
      <div class="mock-label">D · NARRATIVE</div>
      <svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
        <style>
          .title { font: 600 16px Inter, sans-serif; fill: #f1f5f9; }
          .sub   { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
          .body  { font: 400 13px Inter, sans-serif; fill: #cbd5e1; }
          .accent{ font: 500 13px Inter, sans-serif; fill: #c8f000; }
          .down  { font: 500 13px Inter, sans-serif; fill: #e5321c; }
        </style>
        <text x="20" y="32" class="title">2001</text>
        <text x="20" y="52" class="sub">NARRATIVE</text>

        <line x1="20" x2="460" y1="68" y2="68" stroke="#3a352c" stroke-width="1"/>

        <text x="20" y="98" class="body">Against the backdrop of the</text>
        <text x="20" y="118"><tspan class="accent">dot-com bust</tspan><tspan class="body"> and </tspan><tspan class="accent">9/11</tspan><tspan class="body">,</tspan></text>
        <text x="20" y="138"><tspan class="body">music </tspan><tspan class="down">valence fell 6 pts</tspan><tspan class="body"> while</tspan></text>
        <text x="20" y="158" class="body">tempo held steady — the </text>
        <text x="20" y="178" class="body">sharpest one-year drop of the </text>
        <text x="20" y="198" class="body">decade.</text>
      </svg>
    </div>
  </div>

</div>

<h2 style="margin-top:48px">Recommendation: A + C combined (two-column)</h2>
<div class="mock" style="max-width:1100px;">
  <div class="mock-label">A + C · COMBINED</div>
  <svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
    <style>
      .title { font: 600 18px Inter, sans-serif; fill: #f1f5f9; }
      .sub   { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 0.05em; }
      .label { font: 400 12px Inter, sans-serif; fill: #cbd5e1; }
      .val   { font: 500 13px 'JetBrains Mono', monospace; fill: #f1f5f9; }
      .down  { font: 500 11px 'JetBrains Mono', monospace; fill: #e5321c; }
      .flat  { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .crisis{ font: 500 11px Inter, sans-serif; fill: #e5321c; }
      .v     { font: 500 12px 'JetBrains Mono', monospace; fill: #f1f5f9; }
      .reg   { font: 400 12px Inter, sans-serif; fill: #cbd5e1; }
    </style>
    <!-- Left column: crisis delta -->
    <text x="24" y="36" class="title">2001</text>
    <text x="24" y="56" class="sub">VS. 1998–2000 BASELINE</text>
    <line x1="24" x2="470" y1="72" y2="72" stroke="#3a352c"/>
    <text x="24"  y="96"  class="label">Energy</text>
    <text x="200" y="96"  class="val">69.5%</text>
    <text x="290" y="96"  class="down">▼ 4.2 pts</text>
    <text x="24"  y="120" class="label">Valence</text>
    <text x="200" y="120" class="val">58.6%</text>
    <text x="290" y="120" class="down">▼ 6.1 pts</text>
    <text x="24"  y="144" class="label">Tempo</text>
    <text x="200" y="144" class="val">117 BPM</text>
    <text x="290" y="144" class="flat">▬ 0.4 pts</text>
    <text x="24"  y="168" class="label">Danceability</text>
    <text x="200" y="168" class="val">62.1%</text>
    <text x="290" y="168" class="down">▼ 1.8 pts</text>
    <line x1="24" x2="470" y1="186" y2="186" stroke="#3a352c"/>
    <circle cx="32" cy="208" r="4" fill="#f0a830"/>
    <text x="44" y="212" class="crisis" style="fill:#f0a830">Dot-com bust</text>
    <circle cx="170" cy="208" r="4" fill="#e5321c"/>
    <text x="182" y="212" class="crisis">9/11 &amp; War on Terror</text>

    <!-- Divider -->
    <line x1="500" x2="500" y1="24" y2="220" stroke="#3a352c"/>

    <!-- Right column: regional split -->
    <text x="524" y="36" class="title">Valence · by region</text>
    <text x="524" y="56" class="sub">EUROPE · AMERICAS · ASIA</text>
    <line x1="524" x2="970" y1="72" y2="72" stroke="#3a352c"/>

    <text x="524" y="96" class="reg">Europe</text>
    <rect x="640" y="86" width="260" height="12" fill="#3a352c"/>
    <rect x="640" y="86" width="190" height="12" fill="#c8f000"/>
    <text x="910" y="96" class="v">61.2%</text>

    <text x="524" y="124" class="reg">Americas</text>
    <rect x="640" y="114" width="260" height="12" fill="#3a352c"/>
    <rect x="640" y="114" width="160" height="12" fill="#e5321c"/>
    <text x="910" y="124" class="v">56.8%</text>

    <text x="524" y="152" class="reg">Asia</text>
    <rect x="640" y="142" width="260" height="12" fill="#3a352c"/>
    <rect x="640" y="142" width="175" height="12" fill="#6aabf0"/>
    <text x="910" y="152" class="v">58.4%</text>

    <line x1="524" x2="970" y1="186" y2="186" stroke="#3a352c"/>
    <text x="524" y="212" class="sub">SPREAD</text>
    <text x="600" y="212" class="v">4.4 pts</text>
    <text x="710" y="212" class="sub">HIGHEST</text>
    <text x="800" y="212" class="v">Europe</text>
  </svg>
</div>

</body>
</html>
